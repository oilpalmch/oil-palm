<title>OIL PALM 後台</title>

<style>
:root{--bg:#F4F2EE;--card:#fff;--ink:#22201C;--ink2:#5C574F;--ink3:#8F887C;--rule:#E4DFD6;--acc:#B7791F;--acc2:#8A5A12;--up:#2E7D4F;--dn:#B23B2E;--chip:#F7F1E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--card:#201E1A;--ink:#EEEAE2;--ink2:#BDB6AA;--ink3:#8C857A;--rule:#34312B;--acc:#E0A64A;--acc2:#F0C27A;--chip:#2A2620}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:17px;margin:0;flex:1}
header .me{font-size:13px;color:var(--ink3)}
header select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.line{background:transparent;color:var(--acc2);border:1px solid var(--rule)}
main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.gate{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:28px;text-align:center}
.gate p{color:var(--ink2)}
.err{color:var(--dn);min-height:1.4em;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.kpi small{color:var(--ink3);display:block}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:99px;padding:7px 16px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:12px;color:var(--ink3);font-weight:600;background:var(--chip);position:sticky;top:0;cursor:pointer;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.muted{color:var(--ink3)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input,.bar select{font:inherit;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);min-width:220px}
.detail h2{margin:4px 0 2px;font-size:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.dl{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--rule)}
.dl div:last-child{border-bottom:0}
.dl span{color:var(--ink3)}
h3{margin:18px 0 8px;font-size:15px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}header .me{display:none}main{padding:14px 16px 50px}}
</style>
</head>

var LANG=(function(){ try{ var v=localStorage.getItem("op-admin-lang"); if(v) return v; }catch(e){} var n=(navigator.language||"").toLowerCase(); return n.indexOf("ms")===0?"ms":n.indexOf("en")===0?"en":"zh"; })();

var DATA=null;
function load(){
  main.innerHTML=""; var g1=el("div","gate"); g1.appendChild(el("p",null,L("讀取全部園主的資料…"))); main.appendChild(g1);
  Promise.all([db.collection("users").get(), db.collection("farms").get()]).then(function(res){
    var users={}; res[0].forEach(function(d){ users[d.id]=d.data(); });
    var farms=res[1].docs;
    return Promise.all(farms.map(function(f){
      var ref=db.collection("farms").doc(f.id);
      return Promise.all([ref.collection("state").doc("main").get(), ref.collection("records").get()]).then(function(r){
        var st={}; try{ st=JSON.parse((r[0].data()||{}).j||"{}"); }catch(e){}
        var recs=[]; r[1].forEach(function(d){ try{ recs.push(JSON.parse(d.data().j)); }catch(e){} });
        var fm=f.data()||{}, owner=fm.owner||f.id;
        return {id:f.id, farm:fm, user:users[owner]||{}, st:st, recs:recs};
      });
    }));
  }).then(function(list){
    DATA=list.map(summarise);
    show("users");
  }).catch(function(e){
    main.innerHTML=""; var g=el("div","gate");
    g.appendChild(el("p",null,L("讀不到資料：")+String(e&&e.code||e)));
    g.appendChild(el("p","muted",L("如果是 permission-denied：Firestore 的 Rules 還沒換成有管理員的那一版。")));
    main.appendChild(g);
  });
}
function plotArea(st){ var p=st.plot||{}; return num(p.area!=null?p.area:p.acres); }
function unitNm(st){ var u=(st.settings||{}).unit; return u==="ha"?L("公頃"):u==="relong"?L("依格"):L("畝"); }
function hTon(r){ return r.kg!=null?num(r.kg)/1000:num(r.tonnes); }
function fertName(st,id){ var fs=st.ferts||[]; for(var i=0;i<fs.length;i++) if(fs[i].id===id) return fs[i].nm; return id||""; }
function summarise(x){
  var y=String(new Date().getFullYear()), s={ton:0,tonY:0,income:0,cost:0,fertBags:0,fertRm:0,last:"",n:x.recs.length};
  x.recs.forEach(function(r){
    if(r.date&&r.date>s.last) s.last=r.date;
    var yr=String(r.date||"").slice(0,4);
    if(r.kind==="harvest"){ s.ton+=hTon(r); if(yr===y) s.tonY+=hTon(r); }
    if(r.kind==="statement"&&yr===y) s.income+=num(r.net);
    if(r.kind==="expense"&&yr===y) s.cost+=num(r.amount);
    if(r.kind==="fert"&&yr===y){ s.fertBags+=num(r.bags); s.fertRm+=num(r.bags)*num(r.priceBag); }
  });
  x.sum=s; return x;
}
var TABS=[["users",L("用戶")],["data",L("數據")],["land",L("地")],["fert",L("放肥資料")]];
function show(tab,detail){
  main.innerHTML="";
  var all=DATA, y=new Date().getFullYear();
  var k=el("div","kpis");
  function kpi(a,b){ var d=el("div","kpi"); d.appendChild(el("small",null,a)); d.appendChild(el("b",null,b)); k.appendChild(d); }
  var ton=0,inc=0,trees=0; all.forEach(function(x){ ton+=x.sum.tonY; inc+=x.sum.income; trees+=num((x.st.plot||{}).trees); });
  kpi(L("園主"),fx(all.length)); kpi(y+L(" 年賣果"),fx(ton,1)+L(" 噸")); kpi(y+L(" 年收入（月結單）"),rm(inc)); kpi(L("總樹數"),fx(trees));

  main.appendChild(tabs);
  var bar=el("div","bar"), q=el("input"); q.placeholder=L("搜尋名字、Email、電話、地方"); bar.appendChild(q); main.appendChild(bar);
  var card=el("div","card"); main.appendChild(card);
  var cols={
    users:[[L("名字"),function(x){ return x.user.name||(x.st.plot||{}).name||""; }],["Email",function(x){ return x.user.email||""; }],[L("電話"),function(x){ return x.user.phone||""; }],[L("地方"),function(x){ return x.user.town||(x.st.settings||{}).rainPlace||""; }],[L("記錄"),function(x){ return x.sum.n; },1],[L("最近一筆"),function(x){ return x.sum.last; }],[L("上次打開"),function(x){ return String(x.user.seen||"").slice(0,10); }]],
    data:[[L("園主"),function(x){ return x.user.name||x.user.email||""; }],[y+L(" 賣果（噸）"),function(x){ return fx(x.sum.tonY,2); },1],[L("全部賣果（噸）"),function(x){ return fx(x.sum.ton,2); },1],[y+L(" 收入"),function(x){ return rm(x.sum.income); },1],[y+L(" 開銷"),function(x){ return rm(x.sum.cost); },1],[L("每畝每年噸數"),function(x){ var a=plotArea(x.st); return a?fx(x.sum.tonY/a,2):""; },1],[L("收果商"),function(x){ return (x.st.settings||{}).buyer||""; }]],
    land:[[L("園主"),function(x){ return x.user.name||x.user.email||""; }],[L("園名"),function(x){ return (x.st.plot||{}).name||""; }],[L("面積"),function(x){ var a=plotArea(x.st); return a?fx(a,1)+" "+unitNm(x.st):""; },1],[L("樹數"),function(x){ return fx((x.st.plot||{}).trees); },1],[L("種植年"),function(x){ return (x.st.plot||{}).year||""; },1],[L("土質"),function(x){ var s=(x.st.plot||{}).soil; return s==="peat"?L("泥炭土"):s?L("普通土"):""; }],[L("雨量地點"),function(x){ return (x.st.settings||{}).rainPlace||""; }]],
    fert:[[L("園主"),function(x){ return x.user.name||x.user.email||""; }],[y+L(" 放了幾輪"),function(x){ var r={}; x.recs.forEach(function(z){ if(z.kind==="fert"&&String(z.date).slice(0,4)===String(y)) r[z.round]=1; }); return Object.keys(r).length; },1],[y+L(" 包數"),function(x){ return fx(x.sum.fertBags); },1],[y+L(" 肥料錢"),function(x){ return rm(x.sum.fertRm); },1],[L("每棵每年公斤"),function(x){ var t=num((x.st.plot||{}).trees), kg=0; x.recs.forEach(function(z){ if(z.kind==="fert"&&String(z.date).slice(0,4)===String(y)) kg+=num(z.bags)*(num(z.kgBag)||50); }); return t?fx(kg/t,2):""; },1],[L("有沒有計劃"),function(x){ return (x.st.plans||[]).some(function(p){ return String(p.year)===String(y); })?L("有"):L("沒有"); }],[L("最常用的肥"),function(x){ var c={}; x.recs.forEach(function(z){ if(z.kind==="fert") c[z.fert]=(c[z.fert]||0)+num(z.bags); }); var b=Object.keys(c).sort(function(a,bb){ return c[bb]-c[a]; })[0]; return b?fertName(x.st,b):""; }]]
  }[tab];
  var sortI=-1, asc=true;
  function paint(){
    card.innerHTML=""; var t=el("table"), h=el("tr");
    cols.forEach(function(c,i){ var th=el("th",c[2]?"n":"",c[0]+(i===sortI?(asc?" ▲":" ▼"):"")); th.onclick=function(){ asc=sortI===i?!asc:true; sortI=i; paint(); }; h.appendChild(th); });
    t.appendChild(h);
    var term=q.value.trim().toLowerCase();
    var rows=all.filter(function(x){ if(!term) return true; return [x.user.name,x.user.email,x.user.phone,x.user.town,(x.st.plot||{}).name].join(" ").toLowerCase().indexOf(term)>=0; });
    if(sortI>=0) rows.sort(function(a,b){ var A=cols[sortI][1](a), B=cols[sortI][1](b); var nA=parseFloat(String(A).replace(/[^\d.-]/g,"")), nB=parseFloat(String(B).replace(/[^\d.-]/g,"")); var r=(isFinite(nA)&&isFinite(nB))?nA-nB:String(A).localeCompare(String(B)); return asc?r:-r; });
    rows.forEach(function(x){ var tr=el("tr","click"); cols.forEach(function(c){ tr.appendChild(el("td",c[2]?"n":"",String(c[1](x)))); }); tr.onclick=function(){ show(tab,x); }; t.appendChild(tr); });
    if(!rows.length){ var tr=el("tr"); var td=el("td","muted",L("還沒有資料")); td.colSpan=cols.length; tr.appendChild(td); t.appendChild(tr); }
    card.appendChild(t);
  }
  q.oninput=paint; paint();
}
function showDetail(x){
  var back=el("button","btn line",L("‹ 回列表")); back.onclick=function(){ show("users"); }; main.appendChild(back);
  var d=el("div","detail"); main.appendChild(d);
  d.appendChild(el("h2",null,x.user.name||(x.st.plot||{}).name||x.user.email||x.id));
  d.appendChild(el("div","muted",[x.user.email,x.user.phone,x.user.town].filter(Boolean).join(" · ")));
  var g=el("div","grid2"); d.appendChild(g);
  function dl(title,pairs){ var b=el("div","dl"); b.appendChild(el("h3",null,title)); pairs.forEach(function(p){ var r=el("div"); r.appendChild(el("span",null,p[0])); r.appendChild(el("b",null,p[1]==null||p[1]===""?"—":String(p[1]))); b.appendChild(r); }); g.appendChild(b); }
  var p=x.st.plot||{}, st=x.st.settings||{};
  dl(L("地"),[[L("園名"),p.name],[L("面積"),plotArea(x.st)?fx(plotArea(x.st),1)+" "+unitNm(x.st):""],[L("樹數"),p.trees],[L("種植年"),p.year],[L("土質"),p.soil==="peat"?L("泥炭土"):p.soil?L("普通土"):""],[L("雨量地點"),st.rainPlace]]);
  dl(L("數據（今年）"),[[L("賣果"),fx(x.sum.tonY,2)+L(" 噸")],[L("收入（月結單）"),rm(x.sum.income)],[L("開銷"),rm(x.sum.cost)],[L("肥料"),fx(x.sum.fertBags)+L(" 包 · ")+rm(x.sum.fertRm)],[L("收果商"),st.buyer],[L("全部記錄"),x.sum.n+L(" 筆")]]);
  d.appendChild(el("h3",null,L("放肥計劃")));
  var plans=x.st.plans||[];
  if(!plans.length) d.appendChild(el("div","muted",L("還沒有計劃")));
  plans.slice().sort(function(a,b){ return String(b.year).localeCompare(String(a.year)); }).forEach(function(pl){
    var c=el("div","card"), t=el("table"); var h=el("tr"); [L("年"),L("第幾次"),L("月"),L("肥料"),L("每棵公斤"),L("來源")].forEach(function(n){ h.appendChild(el("th",null,n)); }); t.appendChild(h);
    (pl.rounds||[]).forEach(function(r,i){ (r.items||[{fert:r.fert,kg:r.kg}]).forEach(function(it){ var tr=el("tr"); [pl.year,i+1,r.month||r.m||"",fertName(x.st,it.fert||it.id),it.kg||it.kgTree||"",pl.src||""].forEach(function(v){ tr.appendChild(el("td",null,String(v==null?"":v))); }); t.appendChild(tr); }); });
    c.appendChild(t); d.appendChild(c); c.style.marginBottom="10px";
  });
  d.appendChild(el("h3",null,L("全部記錄")));
  var KN={harvest:L("賣果"),statement:L("月結單"),expense:L("開銷"),fert:L("放肥"),spray:L("打草藥"),diag:L("看樹")};
  var c=el("div","card"), t=el("table"), h=el("tr");
  [L("日期"),L("種類"),L("內容"),L("數字")].forEach(function(n,i){ h.appendChild(el("th",i===3?"n":"",n)); }); t.appendChild(h);
  x.recs.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); }).forEach(function(r){
    var what="", v="";
    if(r.kind==="harvest"){ what=r.slip?L("磅單 ")+r.slip:""; v=fx(hTon(r),2)+L(" 噸"); }
    else if(r.kind==="statement"){ what=(r.month||"")+L(" 果價 RM ")+fx(r.price,2); v=rm(r.net); }
    else if(r.kind==="expense"){ what=(r.cat||"")+(r.note?" · "+r.note:""); v=rm(r.amount); }
    else if(r.kind==="fert"){ what=L("第 ")+(r.round||"?")+L(" 次 · ")+fertName(x.st,r.fert); v=fx(r.bags)+L(" 包"); }
    else { what=r.note||r.herb||r.sym||""; v=""; }
    var tr=el("tr"); [r.date||"",KN[r.kind]||r.kind,what,v].forEach(function(val,i){ tr.appendChild(el("td",i===3?"n":"",String(val))); }); t.appendChild(tr);
  });
  c.appendChild(t); d.appendChild(c);
}
})();
</script>
</body>
</html>
