<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>OIL PALM ERP</title>

<style>
:root{
  --side:#15202B;--side2:#1E2B39;--sideink:#C7D1DB;--sideink2:#7D8B99;
  --bg:#F2F4F7;--card:#FFFFFF;--ink:#1C2632;--ink2:#55606D;--ink3:#8893A0;--rule:#E1E6EB;--head:#F7F8FA;
  --acc:#C47F14;--accs:#FDF3E1;--up:#23855F;--ups:#E3F4EC;--dn:#D0503A;--dns:#FCE8E3;--blue:#2E6BD8;--blues:#E7EFFC;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sideink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid #26343F}
.brand img{width:32px;height:32px;border-radius:8px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.3px}
.brand small{color:var(--sideink2);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav .grp{color:var(--sideink2);font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:12px 10px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--sideink);padding:9px 10px;border-radius:8px;text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:var(--side2);color:#fff}
.nav button.on{background:var(--acc);color:#fff;font-weight:600}
.nav button .ct{margin-left:auto;font-size:11px;background:#2A3947;color:var(--sideink);padding:1px 7px;border-radius:99px}
.nav button.on .ct{background:rgba(255,255,255,.25);color:#fff}
.sidefoot{padding:12px 14px;border-top:1px solid #26343F;font-size:12px}
.sidefoot select{width:100%;background:var(--side2);border:1px solid #2D3C4A;color:var(--sideink);border-radius:7px;padding:6px 8px;margin-bottom:10px}
.who{display:flex;align-items:center;gap:8px;color:var(--sideink2);overflow:hidden}
.who .av{width:26px;height:26px;border-radius:99px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.who button{border:0;background:none;color:var(--sideink2);font-size:12px;padding:2px 4px}
.who button:hover{color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:4}
.crumb{flex:1;min-width:0}
.crumb small{display:block;color:var(--ink3);font-size:12px}
.crumb h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative}
.search input{width:280px;border:1px solid var(--rule);background:var(--head);border-radius:8px;padding:8px 10px 8px 32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2}
.tbtn{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);white-space:nowrap}
.tbtn:hover{border-color:#C9D1D9;color:var(--ink)}
.tbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.upd{color:var(--ink3);font-size:12px;white-space:nowrap}
.content{padding:20px 24px 48px;max-width:1440px;width:100%}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;min-width:0}
.kpi small{color:var(--ink3);font-size:12px;display:block}
.kpi b{display:block;font-size:22px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{font-style:normal;font-size:12px;color:var(--ink3)}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-bottom:16px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.ph h2{margin:0;font-size:14px;font-weight:700;flex:1}
.ph .sub{color:var(--ink3);font-size:12px}
.pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.grid2 .panel{margin-bottom:0}
.row{margin-bottom:16px}
.tw{overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:9px 14px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{background:var(--head);color:var(--ink2);font-size:12px;font-weight:600;position:sticky;top:0;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
th .ar{color:var(--acc);margin-left:4px}
td.r,th.r{text-align:right}
tbody tr:hover td{background:#FAFBFC}
tbody tr.ck{cursor:pointer}
tbody tr.ck:hover td{background:var(--accs)}
.muted{color:var(--ink3)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--head);color:var(--ink2);border:1px solid var(--rule)}
.tag.g{background:var(--ups);color:var(--up);border-color:transparent}
.tag.r{background:var(--dns);color:var(--dn);border-color:transparent}
.tag.b{background:var(--blues);color:var(--blue);border-color:transparent}
.tag.a{background:var(--accs);color:var(--acc);border-color:transparent}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;color:var(--ink3);font-size:12px}
.pager .sp{flex:1}
.pager button{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:3px 10px;color:var(--ink2)}
.pager button:disabled{opacity:.4;cursor:default}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters select{border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--card)}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding:8px 4px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bars .b span{font-size:11px;color:var(--ink3);margin-top:6px;white-space:nowrap}
.bars .b em{font-style:normal;font-size:11px;color:var(--ink2);margin-bottom:3px}
.dhead{display:flex;gap:16px;align-items:center;padding:16px;flex-wrap:wrap}
.dhead .av{width:52px;height:52px;border-radius:12px;background:var(--accs);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.dhead h2{margin:0;font-size:19px}
.dhead .meta{color:var(--ink2);font-size:13px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--rule)}
.facts div{padding:12px 16px;border-right:1px solid var(--rule)}
.facts div:last-child{border-right:0}
.facts small{display:block;color:var(--ink3);font-size:12px}
.facts b{font-size:16px}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--rule);overflow:auto}
.tabs button{border:0;background:none;padding:11px 12px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.login{min-height:100vh;display:grid;place-items:center;background:var(--side)}
.lbox{background:var(--card);border-radius:14px;padding:32px;width:min(400px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lbox img{width:56px;height:56px;border-radius:14px}
.lbox h1{font-size:20px;margin:12px 0 4px}
.lbox p{color:var(--ink2);margin:0 0 20px}
.lbox .tbtn{width:100%;justify-content:center;padding:11px}
.lbox select{margin-top:16px;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--card)}
.err{color:var(--dn);min-height:1.4em;margin-top:12px;font-size:13px}
.empty{padding:40px;text-align:center;color:var(--ink3)}
.spin{padding:80px;text-align:center;color:var(--ink3)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.facts{grid-template-columns:repeat(3,minmax(0,1fr))}.facts div:nth-child(3n){border-right:0}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:6}
  .brand{padding:10px 16px;border-bottom:0}
  .nav{display:flex;gap:4px;overflow-x:auto;padding:0 8px 8px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{display:none}
  .nav button{width:auto;white-space:nowrap;padding:7px 12px}
  .nav button .ct{display:none}
  .sidefoot{display:none}
  .top{position:static;flex-wrap:wrap;padding:10px 16px}
  .search{order:5;width:100%}
  .search input{width:100%}
  .content{padding:14px 16px 40px}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div{border-right:0}
  .upd{display:none}
  .mfoot{display:flex!important}
}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hrow>div:first-child{flex:1;min-width:220px}
.bigt{margin:0 0 4px;font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:99px;padding:6px 14px;color:var(--ink2);font-weight:600;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sect{font-size:14px;margin:18px 0 10px;color:var(--ink2)}
.kpi .dl{font-size:12px;color:var(--ink3);margin-top:4px}
.kpi .dl .up{color:var(--up)} .kpi .dl .dn{color:var(--dn)}
.hbar{width:160px;height:8px;background:var(--head);border-radius:99px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.funnel .fstep{display:grid;grid-template-columns:200px minmax(0,1fr) 260px;gap:14px;align-items:center;padding:8px 0}
.funnel .fb{height:22px;background:var(--head);border-radius:6px;overflow:hidden}
.funnel .fb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#E0A64A)}
.funnel .fn{color:var(--ink2);font-size:13px}
.note{margin:-6px 2px 16px;font-size:12px}
@media (max-width:900px){.funnel .fstep{grid-template-columns:1fr}.hbar{width:90px}}
.mfoot{display:none;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px 24px;color:var(--ink3);font-size:12px}
.mfoot select{border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--card)}
</style>
</head>

function summarise(x){
  var s={ton:0,tonY:0,inc:0,cost:0,bags:0,fertRm:0,kgFert:0,rounds:{},last:"",n:x.recs.length,fertUse:{}};
  x.recs.forEach(function(r){
    var y=String(r.date||"").slice(0,4);
    if(r.date&&r.date>s.last) s.last=r.date;
    if(r.kind==="harvest"){ s.ton+=hTon(r); if(y===YEAR) s.tonY+=hTon(r); }
    if(r.kind==="statement"&&y===YEAR) s.inc+=num(r.net);
    if(r.kind==="expense"&&y===YEAR) s.cost+=num(r.amount);
    if(r.kind==="fert"){ s.fertUse[r.fert]=(s.fertUse[r.fert]||0)+num(r.bags); if(y===YEAR){ s.bags+=num(r.bags); s.fertRm+=num(r.bags)*num(r.priceBag); s.kgFert+=num(r.bags)*(num(r.kgBag)||50); s.rounds[r.round]=1; } }
  });
  var top=Object.keys(s.fertUse).sort(function(a,b){ return s.fertUse[b]-s.fertUse[a]; })[0];
  s.topFert=top?fertName(x,top):"";
  s.plan=(x.st.plans||[]).some(function(p){ return String(p.year)===YEAR; });
  var seen=daysAgo(x.user.seen), lastR=daysAgo(s.last);
  s.status=!s.n?"none":Math.min(seen,lastR)<=30?"act":"idle";
  x.sum=s; return x;
}
function loadReal(){

        var st={}; try{ st=JSON.parse((r[0].data()||{}).j||"{}"); }catch(e){}

      });
    }));
  });
}

function metrics(a,b){
  var m={sign:0,act:0,recs:0,harv:0,fert:0,exp:0,stmt:0,opens:0,tree:0,voice:0,plan:0,guide:0};
  DATA.forEach(function(x){
    if(inR(signup(x),a,b)) m.sign++;
    if(activeIn(x,a,b)) m.act++;
    m.recs+=recsIn(x,a,b); m.harv+=recsIn(x,a,b,"harvest"); m.fert+=recsIn(x,a,b,"fert"); m.exp+=recsIn(x,a,b,"expense"); m.stmt+=recsIn(x,a,b,"statement");
    m.opens+=useIn(x,a,b,"open"); m.tree+=useIn(x,a,b,"feat:tree"); m.voice+=useIn(x,a,b,"feat:voice"); m.plan+=useIn(x,a,b,"feat:planWizard"); m.guide+=useIn(x,a,b,"feat:fertGuide");
  });
  m.per=m.act?m.recs/m.act:0; m.actRate=DATA.length?m.act/DATA.length*100:0; return m;
}
function delta(cur,prev,dp,pct){
  var d=el("div","dl"); d.appendChild(document.createTextNode(L("上一期")+" "+(pct?fx(prev,1)+"%":fx(prev,dp||0))));
  if(prev||cur){ var df=cur-prev, c=el("span",df>0?"up":df<0?"dn":"",""); c.textContent=" ("+(df>0?"+":"")+(prev?fx(df/prev*100,1)+"%":(df>0?"+"+fx(df,dp||0):fx(df,dp||0)))+")"; d.appendChild(c); }
  return d;
}
var OPS={range:"d7",tab:"sum"};
function drawOps(ct){

  var hero=el("div","panel"), hb=el("div","pb"); hero.appendChild(hb); ct.appendChild(hero);

  var up=el("div","muted"); up.textContent=L("資料更新於")+" "+LOADED.toTimeString().slice(0,5); hrow.appendChild(up);

  bar.appendChild(el("span","muted",R.a+(R.a!==R.b?" – "+R.b:""))); hb.appendChild(bar);

  ct.appendChild(tabs);
  var M=metrics(R.a,R.b), P=metrics(R.pa,R.pb);
  function cards(title,items){

    cards(L("記帳"),[["新增記錄","recs"],["記賣果","harv"],["記放肥","fert"],["記開銷","exp"],["記月結單","stmt"]]);
    cards(L("功能"),[["AI 看樹","tree"],["講話記帳","voice"],["App 排放肥計劃","plan"],["看放肥教學","guide"]]);
    /* 每天活躍會員 */
    var p=panel(ct,L("每天活躍會員"),R.a+" – "+R.b), days=[], vals={}, d0=new Date(R.a+"T00:00:00"), d1=new Date(R.b+"T00:00:00");
    if(R.n<7){ d0.setDate(d0.getDate()-(7-R.n)); }
    for(var d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)) days.push(ymd(d));
    days.forEach(function(ds){ vals[ds]=DATA.filter(function(x){ return activeDays(x)[ds]; }).length; });
    var bars=el("div","bars"), mx=Math.max.apply(null,days.map(function(ds){ return vals[ds]; }).concat([1]));
    days.forEach(function(ds){ var b=el("div","b"); b.appendChild(el("em","num",vals[ds]?String(vals[ds]):"")); var i=el("i"); i.style.height=(vals[ds]/mx*145)+"px"; b.appendChild(i); b.appendChild(el("span",null,days.length>16?(ds.slice(8)==="01"||days.indexOf(ds)%5===0?ds.slice(5):""):ds.slice(5))); bars.appendChild(b); });
    var pb=el("div","pb"); pb.appendChild(bars); p.appendChild(pb);
  } else if(OPS.tab==="feat"){
    var cnt={}, who={};
    DATA.forEach(function(x){ var u=x.user.usage||{}; Object.keys(u).forEach(function(k){ var ds=k.slice(0,10), ev=k.slice(11); if(ds<R.a||ds>R.b) return; cnt[ev]=(cnt[ev]||0)+num(u[k]); who[ev]=who[ev]||{}; who[ev][x.id]=1; }); });
    var pc={}; DATA.forEach(function(x){ var u=x.user.usage||{}; Object.keys(u).forEach(function(k){ var ds=k.slice(0,10), ev=k.slice(11); if(ds<R.pa||ds>R.pb) return; pc[ev]=(pc[ev]||0)+num(u[k]); }); });
    var keys=Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; }), mx=Math.max.apply(null,keys.map(function(k){ return cnt[k]; }).concat([1]));
    var p=panel(ct,L("功能使用排行"),R.a+" – "+R.b);
    simpleTable(p,[L("功能"),L("次數"),L("用過的會員"),L("上一期"),""],keys.map(function(k){ var b=el("div","hbar"); var i=el("i"); i.style.width=(cnt[k]/mx*100)+"%"; b.appendChild(i); return [evName(k),fx(cnt[k]),Object.keys(who[k]).length,fx(pc[k]||0),b]; }),[1,2,3]);
    ct.appendChild(el("p","muted note",L("「次數」是打開那個畫面或按那個功能的次數；手機上的 App 要有網路才會把次數送上來。")));
  } else if(OPS.tab==="funnel"){
    var steps=[["註冊",function(){ return true; }],["填了園地（樹數）",function(x){ return num(plot(x).trees)>0; }],["記過第一筆賣果",function(x){ return x.recs.some(function(r){ return r.kind==="harvest"; }); }],
      ["記過放肥",function(x){ return x.recs.some(function(r){ return r.kind==="fert"; }); }],["有今年放肥計劃",function(x){ return x.sum.plan; }],["30 天內有回來",function(x){ var t=new Date(); t.setDate(t.getDate()-29); return activeIn(x,ymd(t),TODAY); }]];
    var p=panel(ct,L("會員漏斗"),L("全部會員，到今天為止")), pb=el("div","pb funnel"); p.appendChild(pb);
    var base=DATA.length||1, prev=DATA.length;
    steps.forEach(function(s,i){ var n=DATA.filter(s[1]).length, r=el("div","fstep");
      r.appendChild(el("div","fl",(i+1)+". "+L(s[0]))); var b=el("div","fb"); var bi=el("i"); bi.style.width=(n/base*100)+"%"; b.appendChild(bi); r.appendChild(b);
      r.appendChild(el("div","fn num",fx(n)+"  ·  "+fx(n/base*100,0)+"%"+(i?"  ·  "+L("上一步的")+" "+(prev?fx(n/prev*100,0):0)+"%":""))); pb.appendChild(r); prev=n; });
    ct.appendChild(el("p","muted note",L("掉最多的那一步，就是最需要改的地方。")));
  } else if(OPS.tab==="ret"){
    var p=panel(ct,L("留存"),L("註冊以後還有沒有回來用")), rows=[];
    [[1,"第 1 天後"],[7,"第 7 天後"],[30,"第 30 天後"]].forEach(function(r){
      var elig=DATA.filter(function(x){ var s=signup(x); return s&&daysAgo(s)>=r[0]; }), kept=elig.filter(function(x){ var s=new Date(signup(x)+"T00:00:00"); s.setDate(s.getDate()+r[0]); var ds=ymd(s); return Object.keys(activeDays(x)).some(function(d){ return d>=ds; }); });
      rows.push([L(r[1]),fx(elig.length),fx(kept.length),elig.length?fx(kept.length/elig.length*100,0)+"%":"—"]); });
    simpleTable(p,[L("時間"),L("夠久的會員"),L("有回來"),L("留存率")],rows,[1,2,3]);
    var p2=panel(ct,L("每週新會員還在用嗎"),L("近 8 週")), wk=[], t=new Date(); t.setHours(0,0,0,0); t.setDate(t.getDate()-((t.getDay()+6)%7));
    for(var w=7;w>=0;w--){ var a=new Date(t); a.setDate(a.getDate()-7*w); var b=new Date(a); b.setDate(b.getDate()+6); wk.push([ymd(a),ymd(b)]); }
    simpleTable(p2,[L("註冊那週"),L("新會員"),L("第 2 週"),L("第 3 週"),L("第 4 週")],wk.map(function(w){
      var c=DATA.filter(function(x){ return inR(signup(x),w[0],w[1]); }), out=[w[0].slice(5)+" – "+w[1].slice(5),c.length];
      for(var k=1;k<=3;k++){ var a=new Date(w[0]+"T00:00:00"); a.setDate(a.getDate()+7*k); var b=new Date(a); b.setDate(b.getDate()+6); if(a>new Date()){ out.push("—"); continue; }
        var n=c.filter(function(x){ return activeIn(x,ymd(a),ymd(b)); }).length; out.push(c.length?fx(n/c.length*100,0)+"% ("+n+")":"—"); }
      return out; }),[1,2,3,4]);
  } else if(OPS.tab==="mem"){
    var list=DATA.map(function(x){ var ad=Object.keys(activeDays(x)).filter(function(d){ return d>=R.a&&d<=R.b; }).length, u=x.user.usage||{}, top={};
      Object.keys(u).forEach(function(k){ var ds=k.slice(0,10), ev=k.slice(11); if(ds<R.a||ds>R.b||ev==="open"||ev.indexOf("view:")===0) return; top[ev]=(top[ev]||0)+num(u[k]); });
      var tk=Object.keys(top).sort(function(a,b){ return top[b]-top[a]; })[0], last=Object.keys(activeDays(x)).sort().pop()||"";
      return {x:x,ad:ad,recs:recsIn(x,R.a,R.b),opens:useIn(x,R.a,R.b,"open"),top:tk?evName(tk):"",last:last}; });
    list.sort(function(a,b){ return b.ad-a.ad||b.recs-a.recs; });
    var p=panel(ct,L("會員活動"),R.a+" – "+R.b);
    simpleTable(p,[L("客戶名稱"),L("註冊日"),L("最後一次用"),L("用了幾天"),L("打開次數"),L("新增記錄"),L("最常用的功能"),L("裝置")],list.map(function(o){
      return [o.x.user.name||name(o.x),signup(o.x),o.last,o.ad,o.opens,o.recs,o.top,o.x.user.plat||""]; }),[3,4,5],function(i){ openDetail(list[i].x); });
  }
}
/* 下載：目前這一頁的表格存成 CSV（Excel 打得開，中文不亂碼） */
function exportCsv(){
  var rows, heads, nm;
  if(V.detail){ var x=V.detail; heads=[L("日期"),L("種類"),L("內容"),L("數字")]; rows=x.recs.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); }).map(function(r){ var d=describe(x,r); return [r.date,d.k,d.w,d.v]; }); nm=name(x); }
  else if(V.page==="ops"){ var R=rangeOf(OPS.range); heads=[L("客戶名稱"),"Email",L("註冊日"),L("最後一次用"),L("用了幾天"),L("打開次數"),L("新增記錄")];
    rows=DATA.map(function(x){ return [name(x),x.user.email||"",signup(x),Object.keys(activeDays(x)).sort().pop()||"",Object.keys(activeDays(x)).filter(function(d){ return d>=R.a&&d<=R.b; }).length,useIn(x,R.a,R.b,"open"),recsIn(x,R.a,R.b)]; }); nm="ops-"+R.a+"_"+R.b; }
  else { var page=V.page==="dash"?"data":V.page, cols=COLS[page]; heads=cols.map(function(c){ return L(c[0]); }); rows=rowsFor(page).map(function(x){ return cols.map(function(c){ return cell(c,x); }); }); nm=page; }
  var esc=function(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var csv="﻿"+[heads].concat(rows).map(function(r){ return r.map(esc).join(","); }).join("\r\n");
  var a=el("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download="oilpalm-"+nm+"-"+TODAY+".csv"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
boot();
